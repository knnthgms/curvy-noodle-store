<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A dated planner, an undated planner and a dot grid notebook side by side with a 2027 badge">
  <defs>
    <pattern id="dots" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.4" fill="#43382E" opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="#FFFBF4"/>
  <rect width="1200" height="675" fill="url(#dots)"/>
  <circle cx="1140" cy="620" r="200" fill="#FFE3D0" opacity="0.45"/>
  <circle cx="70" cy="110" r="130" fill="#DDE9D5" opacity="0.4"/>
  <circle cx="1052" cy="135" r="20" fill="#FAD3E0"/>
  <circle cx="1100" cy="135" r="20" fill="#DDE9D5"/>
  <circle cx="1148" cy="135" r="20" fill="#FBE7A8"/>

  <!-- dated planner: grid with day boxes -->
  <g transform="rotate(-5 300 380)">
    <rect x="170" y="190" width="260" height="360" rx="16" fill="#FAD3E0" stroke="#E7A2BE" stroke-width="4"/>
    <rect x="198" y="232" width="204" height="40" rx="8" fill="#FFFBF4"/>
    <g fill="#FFFBF4">
      <rect x="198" y="292" width="62" height="52" rx="6"/><rect x="270" y="292" width="62" height="52" rx="6"/><rect x="342" y="292" width="60" height="52" rx="6"/>
      <rect x="198" y="356" width="62" height="52" rx="6"/><rect x="270" y="356" width="62" height="52" rx="6"/><rect x="342" y="356" width="60" height="52" rx="6"/>
      <rect x="198" y="420" width="62" height="52" rx="6"/><rect x="270" y="420" width="62" height="52" rx="6"/><rect x="342" y="420" width="60" height="52" rx="6"/>
    </g>
  </g>

  <!-- undated planner: blank lines -->
  <g transform="rotate(2 600 360)">
    <rect x="470" y="170" width="260" height="380" rx="16" fill="#DDE9D5" stroke="#A9C39B" stroke-width="4"/>
    <rect x="498" y="212" width="204" height="40" rx="8" fill="#FFFBF4"/>
    <g stroke="#A9C39B" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12">
      <path d="M498 300h204"/><path d="M498 340h204"/><path d="M498 380h204"/><path d="M498 420h204"/><path d="M498 460h204"/>
    </g>
  </g>

  <!-- dot grid notebook -->
  <g transform="rotate(6 900 380)">
    <rect x="770" y="200" width="260" height="360" rx="16" fill="#FBE7A8" stroke="#E2C566" stroke-width="4"/>
    <rect x="798" y="232" width="204" height="40" rx="8" fill="#FFFBF4"/>
    <g fill="#B8963A" opacity="0.75">
      <circle cx="810" cy="320" r="3"/><circle cx="850" cy="320" r="3"/><circle cx="890" cy="320" r="3"/><circle cx="930" cy="320" r="3"/><circle cx="970" cy="320" r="3"/>
      <circle cx="810" cy="360" r="3"/><circle cx="850" cy="360" r="3"/><circle cx="890" cy="360" r="3"/><circle cx="930" cy="360" r="3"/><circle cx="970" cy="360" r="3"/>
      <circle cx="810" cy="400" r="3"/><circle cx="850" cy="400" r="3"/><circle cx="890" cy="400" r="3"/><circle cx="930" cy="400" r="3"/><circle cx="970" cy="400" r="3"/>
      <circle cx="810" cy="440" r="3"/><circle cx="850" cy="440" r="3"/><circle cx="890" cy="440" r="3"/><circle cx="930" cy="440" r="3"/><circle cx="970" cy="440" r="3"/>
      <circle cx="810" cy="480" r="3"/><circle cx="850" cy="480" r="3"/><circle cx="890" cy="480" r="3"/><circle cx="930" cy="480" r="3"/><circle cx="970" cy="480" r="3"/>
    </g>
  </g>

  <!-- 2027 badge -->
  <g transform="rotate(-8 600 90)">
    <rect x="480" y="48" width="240" height="84" rx="42" fill="#43382E"/>
    <text x="600" y="106" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#FFFBF4">2027</text>
  </g>
</svg>
