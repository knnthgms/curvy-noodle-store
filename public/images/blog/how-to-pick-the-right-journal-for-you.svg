<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three notebooks in different sizes and paper types with a magnifying glass, for choosing the right journal">
  <defs>
    <pattern id="dots" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.4" fill="#43382E" opacity="0.07"/>
    </pattern>
    <pattern id="bujodots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.6" fill="#9DBE90"/>
    </pattern>
    <pattern id="graph" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#E3B48F" stroke-width="1.4"/>
    </pattern>
  </defs>

  <!-- background + texture -->
  <rect width="1200" height="675" fill="#FFFBF4"/>
  <rect width="1200" height="675" fill="url(#dots)"/>

  <!-- corner blobs -->
  <circle cx="1140" cy="620" r="200" fill="#FFE3D0" opacity="0.45"/>
  <circle cx="70" cy="110" r="130" fill="#DDE9D5" opacity="0.4"/>

  <!-- washi tape strip -->
  <g transform="rotate(-16 150 90)">
    <rect x="10" y="64" width="260" height="46" rx="6" fill="#FAD3E0" opacity="0.9"/>
    <path d="M30 87h220" stroke="#B02D63" stroke-width="3" stroke-dasharray="2 13" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- traffic-light dots -->
  <circle cx="1052" cy="135" r="20" fill="#FAD3E0"/>
  <circle cx="1100" cy="135" r="20" fill="#DDE9D5"/>
  <circle cx="1148" cy="135" r="20" fill="#FBE7A8"/>

  <!-- A6 small: dot grid, sage -->
  <g transform="rotate(-5 385 405)">
    <rect x="315" y="290" width="140" height="230" rx="14" fill="#FFFFFF" stroke="#A9C39B" stroke-width="5"/>
    <rect x="315" y="290" width="26" height="230" rx="13" fill="#DDE9D5"/>
    <rect x="356" y="312" width="82" height="186" fill="url(#bujodots)"/>
  </g>

  <!-- A4 large (center, slightly back): graph, peach -->
  <g transform="rotate(3 585 330)">
    <rect x="470" y="150" width="210" height="370" rx="16" fill="#FFFFFF" stroke="#E3B48F" stroke-width="5"/>
    <rect x="470" y="150" width="30" height="370" rx="15" fill="#FFE3D0"/>
    <rect x="516" y="176" width="146" height="318" fill="url(#graph)" opacity="0.75"/>
  </g>

  <!-- A5 medium: ruled, pink -->
  <g transform="rotate(6 795 380)">
    <rect x="700" y="228" width="180" height="300" rx="16" fill="#FFFFFF" stroke="#E79BBA" stroke-width="5"/>
    <rect x="854" y="228" width="26" height="300" rx="13" fill="#FAD3E0"/>
    <rect x="724" y="256" width="104" height="16" rx="8" fill="#FAD3E0"/>
    <g stroke="#E9DBDE" stroke-width="5" stroke-linecap="round">
      <path d="M724 300h112M724 330h112M724 360h112M724 390h112M724 420h112M724 450h84"/>
    </g>
  </g>

  <!-- magnifying glass over the center pick -->
  <g transform="rotate(-8 610 300)">
    <line x1="640" y1="330" x2="690" y2="392" stroke="#7C621A" stroke-width="16" stroke-linecap="round"/>
    <circle cx="612" cy="292" r="58" fill="#FBE7A8" opacity="0.35"/>
    <circle cx="612" cy="292" r="58" fill="none" stroke="#7C621A" stroke-width="12"/>
    <circle cx="612" cy="292" r="58" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M590 292a22 22 0 0 1 22 -22" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- sparkle -->
  <path d="M150 540 l9 24 24 9 -24 9 -9 24 -9 -24 -24 -9 24 -9 Z" fill="#FBE7A8"/>
</svg>
